<!doctype html>
<!-- DHMMUN BUILD v0.9.101 - IMMERSIVE LIQUID GLASS EDITION -->
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DHMMUN | Model United Nations</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="DHMMUN | Model United Nations" />
    <meta name="description" content="Welcome to the official DHMMUN platform. Register your delegation and secure your assignment in the ultimate Model UN experience." />
    <!-- Dynamic Theme Color synced with the App's state, rather than OS preference -->
    <meta id="theme-color-meta" name="theme-color" content="#ffffff" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dhmmun.org/" />
    <meta property="og:title" content="DHMMUN | Model United Nations" />
    <meta property="og:description" content="Welcome to the official DHMMUN platform. Register your delegation and secure your assignment in the ultimate Model UN experience." />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://dhmmun.org/" />
    <meta property="twitter:title" content="DHMMUN | Model United Nations" />
    <meta property="twitter:description" content="Welcome to the official DHMMUN platform. Register your delegation and secure your assignment in the ultimate Model UN experience." />

    <!-- Apple Web App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DHMMUN" />

    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var themeColorMeta = document.getElementById('theme-color-meta');
          
          var isDark = false; // Default to false (Light Mode)
          if (savedTheme === 'dark' || savedTheme === 'light') {
            isDark = savedTheme === 'dark';
          }
          
          if (isDark) {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            if (themeColorMeta) themeColorMeta.setAttribute('content', '#0a0a0a');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            if (themeColorMeta) themeColorMeta.setAttribute('content', '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
